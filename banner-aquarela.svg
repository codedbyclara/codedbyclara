<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="320" viewBox="0 0 1200 320">

  <defs>
    <radialGradient id="violet">
      <stop offset="0%" stop-color="#A855F7" stop-opacity=".85"/>
      <stop offset="45%" stop-color="#7E22CE" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#4C1D95" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="deep">
      <stop offset="0%" stop-color="#6D28D9" stop-opacity=".8"/>
      <stop offset="60%" stop-color="#581C87" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#24103A" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <filter id="texture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise"
                    baseFrequency=".025"
                    numOctaves="3" seed="12"
                    result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise"
                         scale="18"/>
    </filter>
  </defs>

  <!-- Fundo preto -->
  <rect width="1200" height="320" fill="#0D0D12"/>

  <!-- Aquarela do lado esquerdo -->
  <g filter="url(#soft)">
    <ellipse cx="90" cy="100" rx="230" ry="140"
             fill="url(#violet)"/>
    <ellipse cx="270" cy="260" rx="220" ry="120"
             fill="url(#deep)"/>
    <ellipse cx="10" cy="290" rx="170" ry="100"
             fill="url(#violet)"/>
  </g>

  <!-- Manchas orgânicas -->
  <g filter="url(#texture)" opacity=".65">
    <path d="M-30 40
             C60 5 120 70 170 35
             C230 0 290 80 250 125
             C220 165 160 130 130 175
             C90 220 15 185 -10 150 Z"
          fill="#7E22CE" opacity=".45"/>

    <path d="M30 230
             C80 170 140 205 180 180
             C230 160 270 225 230 270
             C190 315 120 275 75 310
             L-10 320 Z"
          fill="#A855F7" opacity=".35"/>

    <path d="M950 5
             C1030 40 1100 0 1170 55
             C1240 110 1160 155 1120 140
             C1050 120 1030 185 970 150
             C920 120 900 50 950 5 Z"
          fill="#6D28D9" opacity=".35"/>
  </g>

  <!-- Aquarela suave do lado direito -->
  <g filter="url(#soft)">
    <ellipse cx="1120" cy="250" rx="220" ry="140"
             fill="url(#violet)"/>
    <ellipse cx="950" cy="60" rx="180" ry="110"
             fill="url(#deep)"/>
  </g>

  <!-- Pequenos respingos -->
  <g fill="#A855F7" opacity=".65">
    <circle cx="290" cy="75" r="3"/>
    <circle cx="220" cy="210" r="4"/>
    <circle cx="85" cy="245" r="2"/>
    <circle cx="1060" cy="90" r="3"/>
    <circle cx="1130" cy="185" r="4"/>
    <circle cx="990" cy="270" r="2"/>
    <circle cx="330" cy="255" r="2"/>
  </g>
</svg>
